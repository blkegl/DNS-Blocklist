name: Build Blocklist

on:
  schedule:
    # 3:00 AM Bangladesh time (UTC+6) = 21:00 UTC the previous day
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
            pip install requests

      - name: Generate blocklist
        run: python build.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add domains.txt

          if git diff --staged --quiet; then
            echo "No changes to domains.txt; skipping commit."
            exit 0
          fi

          git commit -m "Automated blocklist update: $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
