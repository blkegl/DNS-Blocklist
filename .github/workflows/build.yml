name: Build Blocklist

on:
  schedule:
    # 3 AM Bangladesh time (UTC+6)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Generate blocklist
        run: python build.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add domains.txt
          
          # Added --allow-empty so Git creates a commit even when domains.txt hasn't changed
          git commit --allow-empty -m "Automated blocklist update: $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
          git push origin main
